name: Sync generated files

on:
  push:
    branches:
      - main
    paths:
      - 'data/entries/**'
      - 'scripts/build_jsonl.py'
      - 'scripts/update_readme_count.py'
      - 'README.md'
      - 'Makefile'
      - '.github/workflows/sync-generated.yml'

permissions:
  contents: write

concurrency:
  group: sync-generated-main
  cancel-in-progress: true

jobs:
  sync-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync generated files
        run: make sync

      - name: Commit generated file updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/samples.jsonl data/reviewed/v0.1.jsonl README.md
          if git diff --cached --quiet; then
            echo "Generated files are already synchronized."
          else
            git commit -m "Sync generated dataset artifacts"
            git push origin main
          fi
