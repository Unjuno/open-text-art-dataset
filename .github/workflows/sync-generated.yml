name: Sync generated files

on:
  push:
    branches:
      - main
    paths:
      - 'data/entries/**'
      - 'scripts/build_jsonl.py'
      - 'scripts/update_readme_count.py'
      - 'README.md'
      - 'Makefile'

permissions:
  contents: write

jobs:
  sync-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync generated files
        run: make sync

      - name: Commit generated file updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync generated dataset artifacts"
          file_pattern: |
            data/samples.jsonl
            data/reviewed/v0.1.jsonl
            README.md
