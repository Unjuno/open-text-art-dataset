name: Check generated files on PR

on:
  pull_request:
    paths:
      - 'data/entries/**'
      - 'scripts/build_jsonl.py'
      - 'scripts/update_readme_count.py'
      - 'README.md'
      - 'Makefile'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run generator
        run: make sync

      - name: Detect generated file drift
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- data/samples.jsonl data/reviewed/v0.1.jsonl README.md; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "Generated files are synchronized." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            git status --short data/samples.jsonl data/reviewed/v0.1.jsonl README.md > generated-status.txt
            git diff -- data/samples.jsonl data/reviewed/v0.1.jsonl README.md > generated.diff
            {
              echo "## Generated files need synchronization"
              echo ""
              echo "Run this locally, then commit the changed generated files:"
              echo ""
              echo '```bash'
              echo "make sync"
              echo "make check"
              echo '```'
              echo ""
              echo "Changed generated files:"
              echo ""
              echo '```text'
              cat generated-status.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR when generated files are stale
        if: steps.drift.outputs.needs_sync == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = fs.readFileSync('generated-status.txt', 'utf8').trim() || '(no status output)';
            const body = [
              'Generated dataset artifacts are out of sync.',
              '',
              'Please run:',
              '',
              '```bash',
              'make sync',
              'make check',
              '```',
              '',
              'Then commit the updated generated files.',
              '',
              'Changed generated files:',
              '',
              '```text',
              status,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail when generated files are stale
        if: steps.drift.outputs.needs_sync == 'true'
        run: |
          echo "Generated files are stale. Run make sync and commit the result."
          exit 1
