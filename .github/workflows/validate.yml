name: Validate dataset

on:
  push:
  pull_request:

jobs:
  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate entry files
        run: python scripts/validate_entries.py

      - name: Build JSONL artifacts
        run: python scripts/build_jsonl.py

      - name: Validate generated sample dataset
        run: python scripts/validate_jsonl.py data/samples.jsonl --schema schemas/entry.schema.json

      - name: Validate generated reviewed dataset
        run: python scripts/validate_jsonl.py data/reviewed/v0.1.jsonl --schema schemas/entry.schema.json

      - name: Report near-duplicate candidates
        run: python scripts/report_near_duplicates.py --threshold 0.85

      - name: Ensure generated artifacts are committed
        run: git diff --exit-code
